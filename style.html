<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML Basics</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid rgb(239, 32, 32);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(35, 4, 4);
            color: white;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Anitha</td>
            <td>HTML</td>
            <td>21</td>
        </tr>

        <tr>
            <td>Ravi</td>
            <td>Java</td>
            <td>22</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>Python</td>
            <td>21</td>
        </tr>
    </table>

</body>
</html>
